# Render deployment blueprint for EV Charging Station Placement & Route Planning
# Free tier, auto-deploy on every push to main

services:
  - type: web
    name: ev-charging-planner
    runtime: docker
    plan: free
    autoDeploy: true
    healthCheckPath: /api/health
    buildCommand: docker build -t ev-charging-planner .
    startCommand: ./start.sh
